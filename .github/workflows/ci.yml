name: CI

on:
    # Validate pull requests without deploying them.
    pull_request:

    # Validate changes whenever the stable documentation branch changes.
    push:
        branches:
            - main

# CI only needs to read the repository and upload its build artifact.
permissions:
    contents: read

jobs:
    build:
        name: Build documentation
        runs-on: ubuntu-latest

        steps:
            # Checkout the complete repository.
            #
            # fetch-depth: 0 is intentional. It allows Docusaurus to access
            # Git history when features such as last-update timestamps are used.
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Use the Node.js version expected by this project.
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            # Install exactly the dependencies recorded in package-lock.json.
            - name: Install dependencies
              run: npm ci

            # Run the production Docusaurus build.
            #
            # This generates the complete static website, including:
            # - documentation pages
            # - versioned documentation
            # - SEO metadata
            # - search assets
            # - Markdown/LLM resources
            - name: Build documentation
              run: npm run build

            # Tell GitHub Pages that the build directory is a deployable
            # static site artifact.
            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            # Upload the generated Docusaurus site so the deployment workflow
            # can retrieve the artifact after CI succeeds on main.
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./build
