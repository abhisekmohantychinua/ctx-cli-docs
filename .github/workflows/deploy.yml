name: Deploy Documentation

on:
    # Deploy only after the CI workflow completes successfully on main.
    workflow_run:
        workflows:
            - CI
        types:
            - completed
        branches:
            - main

# Prevent multiple deployments from running at the same time.
# If another push reaches main while a deployment is running,
# GitHub will cancel the older in-progress deployment.
concurrency:
    group: github-pages
    cancel-in-progress: true

# GitHub Pages deployment requires these permissions.
permissions:
    contents: read
    actions: read
    pages: write
    id-token: write

jobs:
    deploy:
        name: Deploy to GitHub Pages

        # Only deploy when the CI workflow completed successfully.
        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest

        # GitHub Pages deployments use the github-pages environment.
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            # Download the normal documentation artifact produced by
            # the specific CI run that triggered this deployment.
            - name: Download documentation artifact
              uses: actions/download-artifact@v7
              with:
                  name: docusaurus-build
                  path: ./build
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            # Configure GitHub Pages for this deployment.
            - name: Configure GitHub Pages
              uses: actions/configure-pages@v6

            # Package the actual Docusaurus output as the special
            # GitHub Pages artifact expected by deploy-pages.
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./build

            # Publish the Pages artifact.
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
